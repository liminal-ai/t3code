name: CCode Long macOS ARM64 Test Release

on:
  push:
    branches:
      - research/claude-desktop-upstream
  workflow_dispatch:
    inputs:
      code_seal:
        description: >-
          adhoc: valid ad-hoc seal only, personal-test use (default; no Apple
          credentials needed). developer-id: Developer ID signing + notarization
          (work-safe; requires the Apple credentials and fails closed without them).
        type: choice
        default: adhoc
        options:
          - adhoc
          - developer-id

permissions:
  contents: read

concurrency:
  group: ccode-long-macos-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  # Push builds are always the ad-hoc personal-test candidate. Developer ID is
  # an explicit manual choice; when requested it never falls back to ad-hoc.
  CODE_SEAL: ${{ github.event.inputs.code_seal || 'adhoc' }}

jobs:
  verify:
    name: Verify CCode Long desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Check formatting and lint
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test sequentially
        run: vp run -r --concurrency-limit 1 test

      - name: Build desktop
        run: vp run build:desktop

      - name: Smoke Electron launch
        run: timeout 30s xvfb-run -a vp run test:desktop-smoke

  build-macos-arm64:
    name: Build macOS Apple Silicon
    needs: verify
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Require work-safe signing credentials
        if: env.CODE_SEAL == 'developer-id'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # This channel is work-safe only. Missing credentials fail the job;
          # there is deliberately no unsigned fallback here.
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [[ -n "${!name}" ]] || missing+=("secrets.${name}")
          done
          [[ -n "${APPLE_TEAM_ID}" ]] || missing+=("vars.APPLE_TEAM_ID")
          if (( ${#missing[@]} > 0 )); then
            echo "Work-safe macOS signing requires: ${missing[*]}" >&2
            exit 1
          fi
          if [[ ! "${APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "vars.APPLE_TEAM_ID must be a 10-character Apple Developer Team ID." >&2
            exit 1
          fi
          # electron-builder/notarytool read APPLE_API_KEY as a .p8 file path.
          # Persist the path for the following steps' shell environment; the
          # raw key text stays scoped to this step.
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build Developer ID signed and notarized test release
        if: env.CODE_SEAL == 'developer-id'
        shell: bash
        # APPLE_API_KEY (the .p8 path) is inherited from the preflight step via
        # GITHUB_ENV; it is intentionally not redeclared here.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          [[ -f "${APPLE_API_KEY:-}" ]] || { echo "APPLE_API_KEY .p8 path is missing." >&2; exit 1; }
          build_date="$(date -u +%Y%m%d)"
          # The ccode-long prerelease discriminator selects CCode Long identity
          # in both the packager and the runtime (see
          # packages/shared/src/desktopProductIdentity.ts).
          version="0.0.0-ccode-long.${build_date}.${GITHUB_RUN_NUMBER}"
          # Plain Developer ID signing: no provisioning profile or Clerk passkey
          # configuration is exported, so the packager uses default hardened
          # runtime entitlements and forceCodeSigning.
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "$version" \
            --signed \
            --verbose
          printf '%s\n' "$version" > release/VERSION

      - name: Build ad-hoc sealed personal-test build
        if: env.CODE_SEAL == 'adhoc'
        shell: bash
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y%m%d)"
          version="0.0.0-ccode-long.${build_date}.${GITHUB_RUN_NUMBER}"
          # No Apple credentials are present or read. --adhoc-sign yields a
          # valid seal only; it is never Developer ID, notarized, or work-safe.
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "$version" \
            --adhoc-sign \
            --verbose
          printf '%s\n' "$version" > release/VERSION

      - name: Verify packaged CCode Long identity from ZIP and DMG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          (( ${#dmgs[@]} == 1 )) || { echo "Expected exactly one DMG; found ${#dmgs[@]}." >&2; exit 1; }
          (( ${#zips[@]} == 1 )) || { echo "Expected exactly one ZIP; found ${#zips[@]}." >&2; exit 1; }
          case "${dmgs[0]##*/}" in CCode-Long-*) ;; *) echo "DMG name is not CCode-Long-*: ${dmgs[0]}" >&2; exit 1;; esac
          case "${zips[0]##*/}" in CCode-Long-*) ;; *) echo "ZIP name is not CCode-Long-*: ${zips[0]}" >&2; exit 1;; esac

          expected_bundle_id="ai.liminal.ccodelong"
          expected_name="CCode Long"
          expected_scheme="ccode-long"

          plist_read() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null || true; }

          # The bundle the runtime will register: identifier, names, URL scheme,
          # executable name and architecture must all be CCode Long's, and none
          # may point at T3 Code Nightly.
          verify_identity() {
            local label="$1" app="$2"
            local plist="$app/Contents/Info.plist"
            echo "== $label identity: $app"
            [[ -f "$plist" ]] || { echo "$label: Info.plist missing" >&2; exit 1; }
            [[ "$(basename "$app")" == "$expected_name.app" ]] || {
              echo "$label: bundle is $(basename "$app"), expected '$expected_name.app'" >&2; exit 1; }
            local bundle_id name display exec_name schemes
            bundle_id="$(plist_read "$plist" CFBundleIdentifier)"
            name="$(plist_read "$plist" CFBundleName)"
            display="$(plist_read "$plist" CFBundleDisplayName)"
            exec_name="$(plist_read "$plist" CFBundleExecutable)"
            schemes="$(plist_read "$plist" CFBundleURLTypes:0:CFBundleURLSchemes | tr -d '[:space:]')"
            echo "CFBundleIdentifier=$bundle_id CFBundleName=$name CFBundleDisplayName=$display CFBundleExecutable=$exec_name CFBundleURLSchemes=$schemes"
            [[ "$bundle_id" == "$expected_bundle_id" ]] || { echo "$label: CFBundleIdentifier=$bundle_id" >&2; exit 1; }
            [[ "$name" == "$expected_name" ]] || { echo "$label: CFBundleName=$name" >&2; exit 1; }
            [[ -z "$display" || "$display" == "$expected_name" ]] || { echo "$label: CFBundleDisplayName=$display" >&2; exit 1; }
            [[ "$exec_name" == "$expected_name" ]] || { echo "$label: CFBundleExecutable=$exec_name" >&2; exit 1; }
            # PlistBuddy prints an array as "Array {", one entry per line, "}"; whitespace-stripped: "Array{ccode-long}"
            [[ "$schemes" == "Array{$expected_scheme}" ]] || { echo "$label: CFBundleURLSchemes=$schemes, expected exactly $expected_scheme" >&2; exit 1; }
            local exe="$app/Contents/MacOS/$expected_name"
            [[ -x "$exe" ]] || { echo "$label: executable missing at $exe" >&2; exit 1; }
            lipo -archs "$exe" | grep -qw arm64 || { echo "$label: executable is not arm64: $(lipo -archs "$exe")" >&2; exit 1; }
            (cd scripts && node verify-desktop-asar-identity.mjs \
              "$app/Contents/Resources/app.asar" ccode-long "$expected_name")
            # Nothing declared may point at T3 Code Nightly.
            if grep -Eiq 't3tools|t3code|nightly' <<<"$bundle_id $name $display $exec_name $schemes"; then
              echo "$label: bundle identity references T3 Code / Nightly" >&2; exit 1
            fi
          }

          zip_dir="$RUNNER_TEMP/identity-zip"
          rm -rf "$zip_dir" && mkdir -p "$zip_dir"
          ditto -x -k "${zips[0]}" "$zip_dir"
          zip_apps=("$zip_dir"/*.app)
          (( ${#zip_apps[@]} == 1 )) || { echo "Expected one .app in ZIP" >&2; exit 1; }
          verify_identity "zip" "${zip_apps[0]}"

          mount_dir="$RUNNER_TEMP/identity-dmg"
          rm -rf "$mount_dir" && mkdir -p "$mount_dir"
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          trap 'hdiutil detach "$mount_dir" -quiet || true' EXIT
          dmg_apps=("$mount_dir"/*.app)
          (( ${#dmg_apps[@]} == 1 )) || { echo "Expected one .app in DMG" >&2; exit 1; }
          verify_identity "dmg" "${dmg_apps[0]}"
          hdiutil detach "$mount_dir" -quiet
          trap - EXIT

          echo "IDENTITY_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Verify Gatekeeper acceptance from ZIP and DMG
        if: env.CODE_SEAL == 'developer-id'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          if (( ${#dmgs[@]} != 1 )); then
            echo "Expected exactly one macOS ARM64 DMG; found ${#dmgs[@]}." >&2
            exit 1
          fi
          if (( ${#zips[@]} != 1 )); then
            echo "Expected exactly one macOS ARM64 ZIP; found ${#zips[@]}." >&2
            exit 1
          fi

          # The checks below are exactly what Gatekeeper evaluates on a
          # quarantined download: a valid seal, a Developer ID authority for
          # the expected team, hardened runtime, a stapled notarization
          # ticket, and spctl acceptance as Notarized Developer ID.
          verify_app() {
            local label="$1" app="$2"
            echo "== $label: $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            local details
            details="$(codesign -dvv "$app" 2>&1)"
            grep -q '^Authority=Developer ID Application:' <<<"$details" || {
              echo "$label: missing Developer ID Application authority" >&2
              printf '%s\n' "$details" >&2
              exit 1
            }
            grep -q "^TeamIdentifier=${APPLE_TEAM_ID}\$" <<<"$details" || {
              echo "$label: TeamIdentifier is not ${APPLE_TEAM_ID}" >&2
              printf '%s\n' "$details" >&2
              exit 1
            }
            grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\(.*runtime.*\)' <<<"$details" || {
              echo "$label: hardened runtime flag missing" >&2
              printf '%s\n' "$details" >&2
              exit 1
            }
            xcrun stapler validate "$app"
            # Capture spctl output even on rejection so the reason is in the
            # log; the greps below decide pass/fail.
            local assessment
            assessment="$(spctl --assess --type execute --verbose=4 "$app" 2>&1 || true)"
            printf '%s\n' "$assessment"
            grep -q 'accepted' <<<"$assessment" || {
              echo "$label: spctl did not accept the app" >&2
              exit 1
            }
            grep -q 'source=Notarized Developer ID' <<<"$assessment" || {
              echo "$label: spctl source is not Notarized Developer ID" >&2
              exit 1
            }
          }

          zip_dir="$RUNNER_TEMP/verify-zip"
          rm -rf "$zip_dir" && mkdir -p "$zip_dir"
          ditto -x -k "${zips[0]}" "$zip_dir"
          zip_apps=("$zip_dir"/*.app)
          (( ${#zip_apps[@]} == 1 )) || { echo "Expected one .app in ZIP" >&2; exit 1; }
          verify_app "zip" "${zip_apps[0]}"

          mount_dir="$RUNNER_TEMP/verify-dmg"
          rm -rf "$mount_dir" && mkdir -p "$mount_dir"
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          trap 'hdiutil detach "$mount_dir" -quiet || true' EXIT
          dmg_apps=("$mount_dir"/*.app)
          (( ${#dmg_apps[@]} == 1 )) || { echo "Expected one .app in DMG" >&2; exit 1; }
          verify_app "dmg" "${dmg_apps[0]}"
          hdiutil detach "$mount_dir" -quiet
          trap - EXIT

          # Reached only when every check above passed.
          echo "VERIFIED_CODE_SEAL=developer-id" >> "$GITHUB_ENV"

      - name: Verify ad-hoc code seal from ZIP and DMG
        if: env.CODE_SEAL == 'adhoc'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          (( ${#dmgs[@]} == 1 )) || { echo "Expected exactly one DMG; found ${#dmgs[@]}." >&2; exit 1; }
          (( ${#zips[@]} == 1 )) || { echo "Expected exactly one ZIP; found ${#zips[@]}." >&2; exit 1; }

          # An ad-hoc seal must be VALID (no "damaged" verdict) and must be
          # exactly ad hoc: no Developer ID authority, no team, no ticket. This
          # step never runs spctl acceptance and never claims work safety.
          verify_adhoc_app() {
            local label="$1" app="$2"
            echo "== $label: $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            local details
            details="$(codesign -dvv "$app" 2>&1)"
            printf '%s\n' "$details"
            grep -q '^Signature=adhoc' <<<"$details" || {
              echo "$label: signature is not ad hoc" >&2
              exit 1
            }
            if grep -q '^Authority=' <<<"$details"; then
              echo "$label: unexpected certificate authority on an ad-hoc build" >&2
              exit 1
            fi
            grep -q '^TeamIdentifier=not set' <<<"$details" || {
              echo "$label: unexpected TeamIdentifier on an ad-hoc build" >&2
              exit 1
            }
          }

          zip_dir="$RUNNER_TEMP/verify-zip"
          rm -rf "$zip_dir" && mkdir -p "$zip_dir"
          ditto -x -k "${zips[0]}" "$zip_dir"
          zip_apps=("$zip_dir"/*.app)
          (( ${#zip_apps[@]} == 1 )) || { echo "Expected one .app in ZIP" >&2; exit 1; }
          verify_adhoc_app "zip" "${zip_apps[0]}"

          mount_dir="$RUNNER_TEMP/verify-dmg"
          rm -rf "$mount_dir" && mkdir -p "$mount_dir"
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          trap 'hdiutil detach "$mount_dir" -quiet || true' EXIT
          dmg_apps=("$mount_dir"/*.app)
          (( ${#dmg_apps[@]} == 1 )) || { echo "Expected one .app in DMG" >&2; exit 1; }
          verify_adhoc_app "dmg" "${dmg_apps[0]}"
          hdiutil detach "$mount_dir" -quiet
          trap - EXIT

          echo "VERIFIED_CODE_SEAL=adhoc" >> "$GITHUB_ENV"

      - name: Collect release candidate
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "${IDENTITY_VERIFIED:-}" != "true" ]]; then
            echo "Refusing to collect a candidate whose packaged identity was not verified." >&2
            exit 1
          fi
          case "${VERIFIED_CODE_SEAL:-}" in
            developer-id|adhoc) ;;
            *)
              echo "Refusing to collect a candidate whose code seal was not verified." >&2
              exit 1
              ;;
          esac
          if [[ "$VERIFIED_CODE_SEAL" != "$CODE_SEAL" ]]; then
            echo "Verified seal '$VERIFIED_CODE_SEAL' does not match requested mode '$CODE_SEAL'." >&2
            exit 1
          fi
          mkdir -p release-candidate
          shopt -s nullglob
          cp release/*.dmg release/*.zip release/VERSION release-candidate/
          for file in release/*.blockmap release/*.yml; do
            [[ -e "$file" ]] && cp "$file" release-candidate/
          done
          (
            cd release-candidate
            shasum -a 256 ./* > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
            # Every status field is derived from the verified seal, never
            # written as a literal. Only a verified Developer ID + notarized
            # seal is work-safe; an ad-hoc seal is personal-test only.
            node --input-type=module -e '
              import { readFile, writeFile } from "node:fs/promises";
              const version = (await readFile("VERSION", "utf8")).trim();
              const seal = process.env.VERIFIED_CODE_SEAL;
              const developerId = seal === "developer-id";
              await writeFile("RELEASE-MANIFEST.json", `${JSON.stringify({
                product: "CCode Long",
                version,
                sourceCommit: process.env.GITHUB_SHA,
                platform: "darwin",
                arch: "arm64",
                codeSeal: seal,
                developerIdSigned: developerId,
                notarized: developerId,
                gatekeeperAccepted: developerId,
                signingTeamId: developerId ? process.env.APPLE_TEAM_ID : null,
                approvedFor: developerId ? "work" : "personal-test",
              }, null, 2)}\n`);
            '
            shasum -a 256 RELEASE-MANIFEST.json >> SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@v7
        with:
          name: ccode-long-macos-arm64-${{ env.CODE_SEAL }}
          path: release-candidate/*
          if-no-files-found: error
          retention-days: 14
